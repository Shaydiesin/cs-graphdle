<div class="container">

    <h1>📊 Statistics</h1>

    <p class="subtitle">
        Your CS-Graphdle progress.
    </p>

    <hr>

    <section class="stats-section">

        <h2>Streaks</h2>

        <p>🔥 Current Streak:
            <strong><span id="current-streak">0</span></strong>
        </p>

        <p>🏆 Longest Streak:
            <strong><span id="longest-streak">0</span></strong>
        </p>

    </section>

    <hr>

    <section class="stats-section">

        <h2>🌳 Spanning Tree</h2>

        <p>Games Played:
            <strong><span id="span-played">0</span></strong>
        </p>

        <p>Games Won:
            <strong><span id="span-won">0</span></strong>
        </p>

        <p>Average Guesses:
            <strong><span id="span-avg">0</span></strong>
        </p>

        <!-- <p>Win Rate:
            <strong><span id="span-rate">0</span>%</strong>
        </p> -->

    </section>

    <hr>

    <section class="stats-section">

        <h2>🔗 Perfect Matching Cut</h2>

        <p>Games Played:
            <strong><span id="pmc-played">0</span></strong>
        </p>

        <p>Games Won:
            <strong><span id="pmc-won">0</span></strong>
        </p>

        <p>Win Rate:
            <strong><span id="pmc-rate">0</span>%</strong>
        </p>

    </section>

    <hr>
